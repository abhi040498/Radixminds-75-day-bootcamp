[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  # Netlify must install TypeScript, Vite, and the other build tools from devDependencies.
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "serverless-http",
    "@supabase/supabase-js",
    "cors",
    "helmet",
    "express-rate-limit",
    "razorpay",
    "zod",
    "dotenv"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
